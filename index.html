<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png" />
    <link rel="stylesheet" href="./css/reset.css" />
    <link rel="stylesheet" href="./css/index.css" />
    <link rel="stylesheet" href="./css/style.css" />
    <title>Frontend Mentor | Weather app</title>
  </head>
  <body>
    <header class="header">
      <nav class="header__navbar">
        <img class="header__logo-image" src="./assets/images/logo.svg" alt="project logo" />
        <button id="unit-btn" type="button" class="header__unit-btn">
          <img class="header__units-image" src="./assets/images/icon-units.svg" alt="" />
          <p class="header__text">Units</p>
          <img class="header__dropdown-image" src="./assets/images/icon-dropdown.svg" alt="" />
        </button>
      </nav>
      <div class="header__dropdown-menu is-hidden">
        <button id="switch-btn" type="button" class="header__switch-btn">Switch to Imperial</button>
        <fieldset class="header__unit-group">
          <legend class="header__unit-title">Temperature</legend>
          <label class="header__unit-option">
            Celsius (°C)
            <input class="header__unit-radio" type="radio" name="temperature" value="celsius" checked />
            <img src="./assets/images/icon-checkmark.svg" alt="" />
          </label>
          <label class="header__unit-option">
            Fahrenheit (°F)
            <input class="header__unit-radio" type="radio" name="temperature" value="fahrenheit" />
          </label>
        </fieldset>
        <fieldset class="header__unit-group">
          <legend class="header__unit-title">Wind Speed</legend>
          <label class="header__unit-option">
            km/h
            <input class="header__unit-radio" type="radio" name="speed" value="km/h" checked />
            <img src="./assets/images/icon-checkmark.svg" alt="" />
          </label>
          <label class="header__unit-option">
            mph
            <input class="header__unit-radio" type="radio" name="speed" value="mph" />
          </label>
        </fieldset>
        <fieldset class="header__unit-group">
          <legend class="header__unit-title">Precipitation</legend>
          <label class="header__unit-option">
            Millimeters (mm)
            <input class="header__unit-radio" type="radio" name="lenght" value="km/h" checked />
            <img src="./assets/images/icon-checkmark.svg" alt="" />
          </label>
          <label class="header__unit-option">
            Inches (in)
            <input class="header__unit-radio" type="radio" name="length" value="mph" />
          </label>
        </fieldset>
      </div>
    </header>
    <h1 class="page-title">How's the sky looking today?</h1>
    <form class="search">
      <div class="search__field">
        <img src="./assets/images/icon-search.svg" alt="seacrh icon" />
        <input
          id="search"
          type="search"
          class="search__input"
          placeholder="Search for a place..."
          aria-label="Search for a place"
        />
      </div>
      <button class="search-btn" type="submit">Search</button>
    </form>
    <main class="main">
      <section class="weather">
        <div class="weather__card">
          <div class="weather__city-info">
            <h2 class="weather__city">Berlin, Germany</h2>
            <p class="weather__date">Tuesday, Aug 5, 2026</p>
          </div>
          <div class="weather__temperature">
            <img class="weather__info-icon" src="/assets/images/icon-sunny.webp" alt="sunny icon" />
            <h3 class="weather__degree">20°</h3>
          </div>
        </div>
        <div class="weather__details">
          <div class="weather__details-card">
            <h4 class="weather__details-label">Feels Like</h4>
            <p class="weather__details-value">18°</p>
          </div>
          <div class="weather__details-card">
            <h4 class="weather__details-label">Humidity</h4>
            <p class="weather__details-value">46%</p>
          </div>
          <div class="weather__details-card">
            <h4 class="weather__details-label">Wind</h4>
            <p class="weather__details-value">14 km/h</p>
          </div>
          <div class="weather__details-card">
            <h4 class="weather__details-label">Precipitation</h4>
            <p class="weather__details-value">0 mm</p>
          </div>
        </div>
      </section>
      <section class="forecast">
        
      </section>
    </main>

      Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. Coded by
      <a href="#">Your Name Here</a>.
    </footer> -->

    <script src="./js/main.js"></script>
  </body>
</html>
